# =============================================================================
# NOUS — GitHub Actions CI/CD Workflow
#
# Builds the complete NOUS Android app with ALL modules including native code.
# Optimized for cloud builds with 7GB+ RAM runners.
#
# Usage:
#   - Push to main: builds debug + release
#   - Pull request: builds debug only
#   - Manual trigger: full build with signing
#
# NOTE: User has NO local PC - this is their ONLY way to build APKs.
# =============================================================================

name: NOUS Build

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
          - both
      sign_release:
        description: 'Sign release build'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Gradle optimization for CI environment
  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=false
    -Dorg.gradle.workers.max=4
    -Dorg.gradle.parallel=true
    -Dorg.gradle.caching=true
    -Dkotlin.incremental=true
    -Dksp.incremental=true
  # NDK version for native code
  ANDROID_NDK_VERSION: "27.1.12297006"
  # Java version
  JAVA_VERSION: '17'
  # SDK versions
  COMPILE_SDK: '36'
  MIN_SDK: '29'
  TARGET_SDK: '36'

jobs:
  # ===========================================================================
  # Job 1: Build Debug APK (always runs)
  # ===========================================================================
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'
      
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3
      
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/build-cache
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      
      - name: Cache NDK builds
        uses: actions/cache@v4
        with:
          path: |
            **/build/.externalNativeBuild
            **/build/obj
            **/build/local
          key: ${{ runner.os }}-ndk-${{ hashFiles('**/CMakeLists.txt', '**/build.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-ndc-
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      - name: Build Debug APK (all modules)
        run: |
          echo "=============================================="
          echo "Building NOUS Debug APK with ALL modules:"
          echo "  - 15 Feature modules"
          echo "  - 11 Core modules"  
          echo "  - 4 Native modules (whisper, llama, ecapa, wakeword)"
          echo "  - 4 Dynamic feature modules"
          echo "=============================================="
          
          ./gradlew assembleDebug \
            --no-daemon \
            --info \
            --stacktrace \
            -PCOMPILE_SDK=${{ env.COMPILE_SDK }} \
            -PMIN_SDK=${{ env.MIN_SDK }} \
            -PTARGET_SDK=${{ env.TARGET_SDK }} || {
            echo "::error::Debug build failed!"
            exit 1
          }
      
      - name: Upload Debug APK artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: warn
      
      - name: Generate Build Report
        if: always()
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Build Type** | Debug |" >> $GITHUB_STEP_SUMMARY
          echo "| **Runner** | ${{ runner.os }} (${{ runner.arch }}) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Modules Built** | 37+ |" >> $GITHUB_STEP_SUMMARY
          echo "| **Native Code** | whisper, llama, ecapa, wakeword |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            APK_SIZE=$(du -h app/build/outputs/apk/debug/app-debug.apk | cut -f1)
            echo "| **APK Size** | $APK_SIZE |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### ✅ Build Successful!" >> $GITHUB_STEP_SUMMARY
            echo "Debug APK ready for download." >> $GITHUB_STEP_SUMMARY
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### ❌ Build Failed" >> $GITHUB_STEP_SUMMARY
            echo "Check the logs above for errors." >> $GITHUB_STEP_SUMMARY
          fi

  # ===========================================================================
  # Job 2: Build Release AAB (runs on push to main or manual trigger)
  # ===========================================================================
  build-release:
    name: Build Release AAB
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: build-debug
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || 
       github.event_name == 'workflow_dispatch' && 
       (github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both')
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'
      
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      
      - name: Cache NDK builds
        uses: actions/cache@v4
        with:
          path: |
            **/build/.externalNativeBuild
            **/build/obj
          key: ${{ runner.os }}-ndk-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-ndc-
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      # Optional: Decode keystore for signed builds
      - name: Decode Keystore
        if: github.event.inputs.sign_release == true
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > app/keystore.jks
          echo "storeFile=keystore.jks" >> keystore.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> keystore.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> keystore.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> keystore.properties
      
      - name: Build Release Bundle
        run: |
          echo "=============================================="
          echo "Building NOUS Release Bundle (AAB)"
          echo "=============================================="
          
          ./gradlew bundleRelease \
            --no-daemon \
            --info \
            -PCOMPILE_SDK=${{ env.COMPILE_SDK }} || {
            echo "::error::Release build failed!"
            exit 1
          }
      
      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-bundle
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
          retention-days: 90
          if-no-files-found: warn

  # ===========================================================================
  # Job 3: Run Unit Tests (optional, on PR)
  # ===========================================================================
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'
      
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-test-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-test-
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      - name: Run unit tests
        run: |
          ./gradlew testDebugUnitTest \
            --no-daemon \
            --continue || true
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/build/reports/tests/'
          retention-days: 14
          if-no-files-found: ignore
      
      - name: Upload test reports to summary
        if: always()
        run: |
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          find . -path "*/test-results/*.xml" | head -5 | while read f; do
            TESTS=$(grep -o 'tests="[0-9]*"' "$f" | grep -o '[0-9]*')
            FAILURES=$(grep -o 'failures="[0-9]*"' "$f" | grep -o '[0-9]*')
            ERRORS=$(grep -o 'errors="[0-9]*"' "$f" | grep -o '[0-9]*')
            echo "- File: $f" >> $GITHUB_STEP_SUMMARY
            echo "  Tests: $TESTS | Failures: $FAILURES | Errors: $ERRORS" >> $GITHUB_STEP_SUMMARY
          done

  # ===========================================================================
  # Job 4: Native Code Analysis (check C++ code quality)
  # ===========================================================================
  native-analysis:
    name: Analyze Native Code
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Check C++ files exist
        run: |
          echo "Checking native module structure..."
          
          WHISPER_CPP=$(find native/whisper -name "*.cpp" -o -name "*.c" 2>/dev/null | wc -l)
          LLAMA_CPP=$(find native/llamacpp -name "*.cpp" -o -name "*.c" 2>/dev/null | wc -l)
          ECAPA_CPP=$(find native/ecapa -name "*.cpp" -o -name "*.c" 2>/dev/null | wc -l)
          WAKEWORD_CPP=$(find native/wakeword -name "*.cpp" -o -name "*.c" 2>/dev/null | wc -l)
          
          echo "## Native Module Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Module | C/C++ Files | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| whisper | $WHISPER_CPP | $([ $WHISPER_CPP -gt 0 ] && echo '✅ Ready' || echo '❌ Missing') |" >> $GITHUB_STEP_SUMMARY
          echo "| llamacpp | $LLAMA_CPP | $([ $LLAMA_CPP -gt 0 ] && echo '✅ Ready' || echo '❌ Missing') |" >> $GITHUB_STEP_SUMMARY
          echo "| ecapa | $ECAPA_CPP | $([ $ECAPA_CPP -gt 0 ] && echo '✅ Ready' || echo '⚠️ Stub') |" >> $GITHUB_STEP_SUMMARY
          echo "| wakeword | $WAKEWORD_CPP | $([ $WAKEWORD_CPP -gt 0 ] && echo '✅ Ready' || echo '⚠️ Stub') |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total native source files:** $((WHISPER_CPP + LLAMA_CPP + ECAPA_CPP + WAKEWORD_CPP))" >> $GITHUB_STEP_SUMMARY
          
          # Verify CMakeLists exist
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### CMake Configuration" >> $GITHUB_STEP_SUMMARY
          for mod in whisper llamacpp ecapa wakeword; do
            if [ -f "native/$mod/src/main/cpp/CMakeLists.txt" ]; then
              echo "- ✅ native/$mod/CMakeLists.txt exists" >> $GITHUB_STEP_SUMMARY
            else
              echo "- ❌ native/$mod/CMakeLists.txt MISSING" >> $GITHUB_STEP_SUMMARY
            fi
          done

  # ===========================================================================
  # Final: Build Summary
  # ===========================================================================
  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [build-debug, build-release, test, native-analysis]
    if: always()
    
    steps:
      - name: Generate final summary
        run: |
          echo "# 🧠 NOUS Build Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "**Event:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Job Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Debug Build | ${{ needs.build-debug.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Release Build | ${{ needs.build-release.result == 'success' && '✅ Passed' || needs.build-release.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.test.result == 'success' && '✅ Passed' || needs.test.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Native Analysis | ${{ needs.native-analysis.result == 'success' && '✅ Complete' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📥 Download Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Go to **Actions → This workflow run → Artifacts** to download:" >> $GITHUB_STEP_SUMMARY
          echo "- \`debug-apks\` - Debug APK(s) for testing" >> $GITHUB_STEP_SUMMARY
          echo "- \`release-bundle\` - Signed release AAB (if built)" >> $GITHUB_STEP_SUMMARY
          echo "- \`test-results\` - Test reports (if available)" >> $GITHUB_STEP_SUMMARY
