# =============================================================================
# NOUS — Release Pipeline
#
# Triggered on tag push (e.g., v2026.7.4-rc1). Builds:
#   1. Signed release AAB (Play Store, prod flavor)
#   2. Signed release APK (GitHub Releases, internal flavor — all features)
#   3. Uploads AAB to Play Store Internal Testing
#   4. Uploads APK to GitHub Releases
#   5. Generates changelog from Conventional Commits
# =============================================================================

name: Release

on:
  push:
    tags:
      - 'v*'

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"
  JAVA_VERSION: "21"
  JAVA_DISTRIBUTION: "temurin"

jobs:
  build-and-release:
    name: Build & Release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;27.1.12297006 cmake;3.22.1'

      - name: Decode signing keystore
        env:
          NOUS_KEYSTORE_BASE64: ${{ secrets.NOUS_KEYSTORE_BASE64 }}
        run: |
          echo "$NOUS_KEYSTORE_BASE64" | base64 -d > nous-upload.jks

      - name: Write keystore.properties
        env:
          NOUS_KEYSTORE_PASSWORD: ${{ secrets.NOUS_KEYSTORE_PASSWORD }}
          NOUS_KEY_ALIAS: ${{ secrets.NOUS_KEY_ALIAS }}
          NOUS_KEY_PASSWORD: ${{ secrets.NOUS_KEY_PASSWORD }}
        run: |
          cat > keystore.properties << EOF
          storeFile=$(pwd)/nous-upload.jks
          storePassword=$NOUS_KEYSTORE_PASSWORD
          keyAlias=$NOUS_KEY_ALIAS
          keyPassword=$NOUS_KEY_PASSWORD
          EOF

      - name: Write secrets.gradle
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          cat > secrets.gradle << EOF
          ext {
              nousOpenAiApiKey = "$OPENAI_API_KEY"
              nousAnthropicApiKey = "$ANTHROPIC_API_KEY"
              nousGeminiApiKey = "$GEMINI_API_KEY"
              nousGroqApiKey = "$GROQ_API_KEY"
              nousOpenRouterApiKey = "$OPENROUTER_API_KEY"
              nousSigningKeyAlias = "nous-upload"
              nousSigningKeyPassword = "$NOUS_KEY_PASSWORD"
              nousSigningStorePassword = "$NOUS_KEYSTORE_PASSWORD"
              nousModelCatalogUrl = "https://raw.githubusercontent.com/roshan/nous-models/main/catalog.json"
          }
          EOF

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s" HEAD)
          else
            CHANGELOG=$(git log --pretty=format:"- %s" $PREV_TAG..HEAD)
          fi
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build prod release AAB (Play Store)
        run: ./gradlew :app:bundleProdRelease --stacktrace

      - name: Build internal release APK (Sideload)
        run: ./gradlew :app:assembleProdInternalRelease --stacktrace

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: nous-prod-release-aab
          path: app/build/outputs/bundle/prodRelease/*.aab
          retention-days: 30

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nous-internal-release-apk
          path: app/build/outputs/apk/prodInternal/release/*.apk
          retention-days: 30

      - name: Publish to Play Store Internal Testing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.roshan.persona
          releaseFile: app/build/outputs/bundle/prodRelease/app-prod-release.aab
          track: internal
          whatsNewDirectory: distribution/whatsnew
          status: completed

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: NOUS ${{ github.ref_name }}
          body: |
            # NOUS ${{ github.ref_name }}

            ## Changelog
            ${{ steps.changelog.outputs.changelog }}

            ## Downloads
            - **Sideload APK (all features)**: see Assets below
            - **Play Store**: rolling out to Internal Testing
          files: |
            app/build/outputs/apk/prodInternal/release/*.apk
          draft: false
          prerelease: ${{ contains(github.ref_name, 'rc') }}
