# =============================================================================
# NOUS — Version Catalog
#
# Single source of truth for all dependency versions and plugin versions.
# Pinned to specific versions (no + or ranges). When upgrading, run:
#   ./gradlew dependencyUpdates  — to see what's available
#   ./gradlew dependencyCheck    — to scan for CVEs
#
# Convention:
#   [versions]   — semantic names, dash-case, no version strings here
#   [libraries]  — group:artifact aliases, dot-separated
#   [bundles]    — groups of libs commonly used together
#   [plugins]    — gradle plugin ids, with their versions
# =============================================================================

