# ─── Convention Plugins (defined in build-logic/, applied in modules) ───────
# These are NOT real Gradle plugin ids — they are precompiled script plugins
# located at build-logic/src/main/kotlin/*.gradle.kts. They are applied via
# `id("jarvis.android.application")` etc. directly inside module build files.
# Versions are inherited from this catalog where needed.
