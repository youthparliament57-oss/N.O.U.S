# =============================================================================
# NOUS — Gradle Properties (Production Ready)
#
# JVM, build, AndroidX, and feature-flag knobs.
# Optimized for CI/CD builds (GitHub Actions with 7GB+ RAM)
# =============================================================================

# ─── JVM (CI/CD Optimized) ────────────────────────────────────────────────
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -XX:+UseG1GC -Dfile.encoding=UTF-8

# Enable parallel for faster CI builds
org.gradle.parallel=true

# Use multiple workers on CI
org.gradle.workers.max=4

# Enable caching for faster rebuilds
org.gradle.caching=true

# Keep daemon alive for faster subsequent builds
org.gradle.daemon=true

# ─── Kotlin (CI/CD Optimized) ───────────────────────────────────────────
kotlin.code.style=official

kotlin.daemon.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m

kotlin.incremental=true
kotlin.build.report.output=file

# KSP — incremental processing (Room, Hilt, Moshi)
ksp.incremental=true

# In-process compilation (saves memory)
kotlin.compiler.execution.strategy=in-process

# ─── AndroidX ──────────────────────────────────────────────────────────────
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true
android.nonFinalResIds=true
android.defaults.buildfeatures.buildconfig=true

# ─── Android Build Performance ──────────────────────────────────────────────
android.experimental.enableNewResourceShrinker=true
android.experimental.enableNewResourceShrinker.preciseShrinking=true
android.suppressUnsupportedCompileSdk=36

# ─── R8 (Enabled for Production) ─────────────────────────────────────────
android.enableR8.fullMode=true

# ─── NDK (Enabled for Native Modules) ─────────────────────────────────────
android.ndk.version=27.1.12297006
android.prefab=true

# ─── NOUS Project-wide ──────────────────────────────────────────────────────
nous.applicationId=com.roshan.persona
nous.compileSdk=36
nous.minSdk=29
nous.targetSdk=36
nous.versionCode=2026080501
nous.versionName="0.1.0-production"

# ─── Secrets (gitignored secrets.gradle overrides these) ────────────────────
NOUS_OPENAI_API_KEY=
NOUS_ANTHROPIC_API_KEY=
NOUS_GEMINI_API_KEY=
NOUS_GROQ_API_KEY=
NOUS_OPENROUTER_API_KEY=
